spring.application.name=fatecads

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/fatecads
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT e reset de senha
app.jwt.secret=chave-super-secreta-para-jwt-em-ambiente-local-1234567890
app.jwt.expiration-ms=86400000
app.reset.expiration-minutes=30
app.reset.base-url=http://localhost:8080

# Integracao WhatsApp (ambiente local de testes)
app.whatsapp.url=http://localhost:3012/whatsapp