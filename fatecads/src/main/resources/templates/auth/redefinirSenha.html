<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/pages/formulario-aluno.css">
</head>

<body class="page-shell">
    <main class="page page-form">
        <section class="section-header">
            <p class="eyebrow">RECUPERACAO //</p>
            <h1>Redefinir Senha</h1>
            <p class="section-copy">Defina sua nova senha para continuar usando o sistema.</p>
        </section>

        <section class="brutal-form" th:if="${erro}">
            <div class="alert alert-error">
                <span th:text="${erro}"></span>
            </div>
            <div class="actions-row">
                <a class="button-secondary" href="/esqueci-senha">Gerar novo link</a>
            </div>
        </section>

        <form class="brutal-form" method="post" th:action="@{/redefinir-senha/{token}(token=${token})}" th:unless="${erro}">

            <div class="form-grid">
                <label class="field field-full" for="novaSenha">
                    <span>Nova senha</span>
                    <input type="password" id="novaSenha" name="novaSenha" required minlength="4">
                </label>
            </div>

            <div class="actions-row">
                <button class="button-primary" type="submit">Salvar nova senha</button>
                <a class="button-secondary" href="/login">Cancelar</a>
            </div>
        </form>
    </main>
</body>

</html>
