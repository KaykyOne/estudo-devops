spring.application.name=fatecads

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fatecads }
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Atualização automática do esquema do banco de dados
spring.jpa.hibernate.ddl-auto=update

# Mostrar as consultas SQL no console
spring.jpa.properties.hibernate.format_sql=false

# Configuração da porta do servidor
server.port=8080

# Limites para upload de imagens dos produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
