<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 32px auto; max-width: 1100px; padding: 0 20px; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 22px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f1f3f5; }
        .produto-imagem { width: 80px; height: 80px; object-fit: contain; border-radius: 5px; border: 1px solid #ddd; }
        .sem-imagem { color: #777; }
        a { margin-right: 10px; }
    </style>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/navigation :: navigation}"></div>
    <h1>Lista de Produtos</h1>
    <p><a th:href="@{/produtos/criar}">Adicionar Novo Produto</a></p>

    <table>
        <thead>
            <tr><th>Imagem</th><th>Descrição</th><th>Valor</th><th>Unidade</th><th>Marca</th><th>Ações</th></tr>
        </thead>
        <tbody>
            <tr th:each="produto : ${produtos}">
                <td>
                    <img class="produto-imagem" th:if="${produto.imagemProduto != null and produto.imagemProduto.length > 0}"
                         th:src="@{/produtos/{id}/imagem(id=${produto.idProduto})}"
                         th:alt="${'Imagem de ' + produto.descricaoProduto}">
                    <span class="sem-imagem" th:unless="${produto.imagemProduto != null and produto.imagemProduto.length > 0}">Sem imagem</span>
                </td>
                <td th:text="${produto.descricaoProduto}"></td>
                <td th:text="${produto.valorProduto}"></td>
                <td th:text="${produto.unidadeProduto}"></td>
                <td th:text="${produto.marcaProduto}"></td>
                <td>
                    <a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}">Editar</a>
                    <a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
