<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao sistema · FatecADS</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <main class="container">
        <h1>Entrar</h1>
        <h2>Use suas credenciais para acessar o FatecADS.</h2>

        <form method="post" th:action="@{/login}">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p th:if="${param.error}" class="mensagem erro">Usuário ou senha inválidos.</p>
        <p th:if="${param.logout}" class="mensagem sucesso">Sessão encerrada com sucesso.</p>

        <form action="/fatecads" method="get">
            <button type="submit" class="btn-home">Voltar para o início</button>
        </form>
    </main>
</body>
</html>
