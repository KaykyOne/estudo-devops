<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatecADS · Sistema acadêmico</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <main class="container">
        <h1>FatecADS</h1>
        <h2>Entre para acessar a gestão acadêmica.</h2>

        <form action="/login" method="get">
            <button type="submit">Acessar sistema</button>
        </form>
        <p class="auth-note">Ainda não tem uma conta?</p>
        <form action="/usuarios/criar" method="get">
            <button type="submit" class="btn-cadastro">Criar minha conta</button>
        </form>
    </main>
</body>
</html>
