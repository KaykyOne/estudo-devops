<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Alunos</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container{
    background-color: white;
    padding: 35px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    width: 400px;
}

h1{
    text-align: center;
    margin-bottom: 25px;
    color: #333;
}

label{
    font-weight: bold;
    display: block;
    margin-top: 12px;
}

input[type="text"]{
    width: 100%;
    padding: 9px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    transition: 0.2s;
}

input[type="text"]:focus{
    border-color: #007bff;
    outline: none;
}

.botao{
    width: 100%;
    margin-top: 20px;
    padding: 10px;
    background-color: #007bff;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}

.botao:hover{
    background-color: #0056b3;
}

.voltar{
    display: block;
    text-align: center;
    margin-top: 15px;
    text-decoration: none;
    color: #555;
}

.voltar:hover{
    text-decoration: underline;
}

</style>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container">

<h1>Cadastro de Alunos</h1>

<form th:action="@{/alunos/salvar}" method="post" th:object="${aluno}">

<input type="hidden" th:field="*{idAluno}">

<label>Nome:</label>
<input type="text" th:field="*{nomeAluno}" required>

<label>Email:</label>
<input type="text" th:field="*{emailAluno}" required>

<label>Telefone:</label>
<input type="text" th:field="*{telefoneAluno}" required>

<label>Endereço:</label>
<input type="text" th:field="*{enderecoAluno}" required>

<label>CPF:</label>
<input type="text" th:field="*{cpfAluno}" required>

<label>RA:</label>
<input type="text" th:field="*{raAluno}" required>

<label>Curso: </label>
<select th:field="*{curso}">
    <option value="" disabled selected>Selecione um curso</option>
    <option th:each="curso : ${cursos}"
            th:text="${curso.nomeCurso}"
            th:value="${curso.idCurso}">
    </option>
</select>

<input type="submit" value="Salvar" class="botao">

</form>

<a href="/alunos/listar" class="voltar">Voltar para lista</a>

</div>

</body>
</html>
